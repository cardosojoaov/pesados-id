name: Coleta PNCP — Pesados.ID

on:
  schedule:
    # 03:00 horário de Brasília (UTC-3) = 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta-pncp
  cancel-in-progress: false

jobs:
  coleta:
    name: Executa ingestion_pipeline-v2.py
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary pandas

      - name: Validar secret configurado
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::Secret SUPABASE_DB_URL não configurado. Vá em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Executar pipeline de ingestão
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          timeout 3000 python ingestion_pipeline-v2.py
        continue-on-error: false

      - name: Exibir summary do pipeline
        if: always()
        run: |
          echo "Execução finalizada."
